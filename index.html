<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YouTubeDownloader</title>
  <meta name="description" content="シンプルな動画ダウンロードUI">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="brand">YouTubeDownloader</div>
      <h1>動画をかんたんに保存</h1>
      <p class="subtitle">YouTubeのリンクを入力して、形式を選択してください。</p>

      <form id="downloadForm">
        <label for="url">YouTube URL</label>
        <div class="input-row">
          <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" required>
          <button class="paste" id="pasteBtn" type="button">貼り付け</button>
        </div>

        <div class="formats" role="group" aria-label="形式">
          <button type="button" class="format active" data-format="mp4">MP4</button>
          <button type="button" class="format" data-format="mp3">MP3</button>
        </div>

        <label for="quality">品質</label>
        <select id="quality">
          <option value="best">最高品質</option>
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="480">480p</option>
          <option value="360">360p</option>
        </select>

        <button class="download" type="submit">ダウンロード</button>
      </form>

      <div id="status" class="status hidden" role="status"></div>

      <div class="notice">
        この静的フロントエンドはダウンロードUIです。実際のMP4/MP3変換には、利用規約・著作権に配慮した許可済みのバックエンド/APIを接続してください。
      </div>
    </section>

    <footer>
      <span>YouTubeDownloader</span>
      <span>Static Frontend</span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
